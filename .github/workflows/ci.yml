# Hosted runners do not need DSH. See README.md for the full local gate.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --cache .npm-cache
      - run: npm run verify:ci
